
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IUT | Inha University</title>

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#102d59">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #07152e, #102d59, #174b83);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* Background effects */
        .glow {
            position: fixed;
            width: 350px;
            height: 350px;
            background: #2685ff;
            filter: blur(150px);
            opacity: 0.2;
            border-radius: 50%;
            pointer-events: none;
        }

        .glow.one {
            top: -100px;
            left: -100px;
        }

        .glow.two {
            bottom: -150px;
            right: -100px;
        }

        /* Header */
        .header {
            position: absolute;
            top: 25px;
            right: 30px;
            z-index: 10;
        }

        .telegram-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 12px;
            background: rgba(38, 133, 255, 0.15);
            border: 1px solid rgba(121, 181, 255, 0.3);
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .telegram-btn:hover {
            background: #2685ff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(38, 133, 255, 0.35);
        }

        .telegram-btn svg {
            width: 21px;
            height: 21px;
            fill: currentColor;
        }

        /* Main container */
        .container {
            text-align: center;
            padding: 40px 20px;
            z-index: 1;
            animation: fadeIn 1s ease;
        }

        /* Stylish logo */
        .logo {
            width: 125px;
            height: 125px;
            margin: 0 auto 32px;
            padding: 9px;
            border-radius: 30px;

            background: linear-gradient(
                145deg,
                rgba(255,255,255,0.22),
                rgba(255,255,255,0.06)
            );

            border: 1px solid rgba(255,255,255,0.4);

            box-shadow:
                0 0 0 6px rgba(255,255,255,0.04),
                0 0 35px rgba(38,133,255,0.35),
                0 15px 40px rgba(0,0,0,0.25);

            backdrop-filter: blur(15px);
            transition: all 0.4s ease;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 23px;
            background: white;
            padding: 5px;
        }

        .logo:hover {
            transform: translateY(-6px) scale(1.05);
            box-shadow:
                0 0 0 8px rgba(255,255,255,0.05),
                0 0 45px rgba(38,133,255,0.55),
                0 20px 45px rgba(0,0,0,0.3);
        }

        /* Title */
        h1 {
            font-size: clamp(32px, 6vw, 64px);
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 17px;
            color: #b8c9df;
            margin-bottom: 45px;
        }

        /* Timetable button */
        .timetable-btn {
            display: inline-block;
            padding: 17px 55px;
            border-radius: 14px;
            background: white;
            color: #102d59;
            text-decoration: none;
            font-size: 17px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
        }

        .timetable-btn:hover {
            transform: translateY(-5px);
            background: #dceaff;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 25px;
            color: #91a8c5;
            font-size: 12px;
            letter-spacing: 1px;
            text-align: center;
            width: 100%;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            .header {
                top: 18px;
                right: 18px;
            }

            .telegram-btn {
                padding: 10px 14px;
                font-size: 12px;
            }

            .logo {
                width: 100px;
                height: 100px;
                border-radius: 25px;
                margin-bottom: 25px;
            }

            .subtitle {
                font-size: 15px;
                margin-bottom: 35px;
            }

            .timetable-btn {
                padding: 15px 45px;
            }

            .footer {
                font-size: 10px;
                bottom: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="glow one"></div>
    <div class="glow two"></div>

    <!-- Telegram Header -->
    <header class="header">
        <a href="https://t.me/iut_chat"
           target="_blank"
           rel="noopener noreferrer"
           class="telegram-btn">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M22 2L2.5 9.5c-1.3.5-1.3 1.4-.2 1.7l5 1.6 1.9 6c.2.7.1 1 .8 1 .5 0 .8-.2 1.1-.5l2.8-2.7 5.8 4.2c1.1.6 1.9.3 2.2-1L24 3.7C24.3 2.1 23.4 1.4 22 2zM9.1 12.4l10.9-6.9c.5-.3.9-.1.5.2l-9 8.1-.4 4.1-2-5.5z"/>
            </svg>

            Telegram
        </a>
    </header>

    <!-- Main Content -->
    <main class="container">

        <div class="logo">
            <img src="logo.jpg" alt="Inha University Logo">
        </div>

        <h1>INHA UNIVERSITY</h1>

        <p class="subtitle">
            Welcome to Inha University in Tashkent
        </p>

        <a href="timetable.html" class="timetable-btn">
            Timetable
        </a>

    </main>

    <!-- Footer -->
    <footer class="footer">
        INHA UNIVERSITY IN TASHKENT
    </footer>

</body>
</html>
