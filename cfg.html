<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080d15">
    <title>sanj1k — player profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root{
            --bg:#070b12;
            --bg2:#0a1019;
            --panel:#0d1420;
            --panel2:#111a27;
            --line:#243142;
            --line2:#1a2533;
            --text:#f7f9fb;
            --muted:#9aa8b8;
            --dim:#68788b;
            --white:#fff;
            --shadow:0 18px 45px rgba(0,0,0,.28);
            --display:'Rajdhani',sans-serif;
            --body:'Inter',sans-serif;
            --mono:'JetBrains Mono',monospace;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html{background:var(--bg);scroll-behavior:smooth}
        body{
            min-height:100vh;
            color:var(--text);
            font-family:var(--body);
            background:
                    radial-gradient(circle at 15% -5%,rgba(62,83,110,.18),transparent 30%),
                    radial-gradient(circle at 90% 5%,rgba(41,58,78,.14),transparent 28%),
                    linear-gradient(180deg,#070b12,#090e16 60%,#070b12);
            padding-bottom:48px;
        }
        body:before{
            content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.32;
            background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
            background-size:44px 44px;
            mask-image:linear-gradient(to bottom,#000 0%,transparent 85%);
        }
        a{color:inherit}
        button{font:inherit}
        .topbar{
            position:sticky;top:0;z-index:20;
            height:58px;
            background:rgba(7,11,18,.92);
            border-bottom:1px solid var(--line);
            backdrop-filter:blur(14px);
        }
        .topbar-inner{
            width:min(1100px,100%);
            height:100%;
            margin:auto;
            padding:0 18px;
            display:flex;
            align-items:center;
            gap:30px;
        }
        .brand{
            text-decoration:none;
            display:flex;
            align-items:baseline;
            gap:7px;
            font:700 22px var(--display);
            letter-spacing:2px;
            white-space:nowrap;
        }
        .brand small{
            font:600 9px var(--mono);
            color:#8b98a8;
            letter-spacing:1px;
        }
        .nav{
            display:flex;
            align-items:center;
            gap:5px;
        }
        .nav a{
            padding:9px 11px;
            border-radius:5px;
            color:#8593a4;
            text-decoration:none;
            font-size:11px;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:.4px;
        }
        .nav a:hover{background:#111b29;color:#fff}
        .nav-spacer{margin-left:auto}
        .profile-tag{
            display:flex;align-items:center;gap:8px;
            color:#c5ced8;
            font:600 11px var(--mono);
        }
        .profile-dot{
            width:7px;height:7px;border-radius:50%;
            background:#fff;box-shadow:0 0 10px rgba(255,255,255,.4);
        }
        .page{
            width:min(1100px,100%);
            margin:0 auto;
            padding:24px 18px 0;
        }
        .profile-card{
            display:grid;
            grid-template-columns:190px 1fr;
            min-height:190px;
            overflow:hidden;
            border:1px solid var(--line);
            border-radius:7px;
            background:linear-gradient(110deg,#0b111b,#0d1520 55%,#0a1019);
            box-shadow:var(--shadow);
        }
        .avatar{
            min-height:190px;
            background:#0a1018;
            border-right:1px solid var(--line);
            position:relative;
            overflow:hidden;
        }
        .avatar img{
            width:100%;height:100%;
            display:block;
            object-fit:cover;
            object-position:center top;
        }
        .avatar:after{
            content:"";
            position:absolute;inset:0;
            background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.25));
            pointer-events:none;
        }
        .profile-info{
            min-width:0;
            padding:27px 28px 22px;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }
        .kicker{
            color:#75859a;
            font:600 10px var(--mono);
            text-transform:uppercase;
            letter-spacing:1.5px;
            margin-bottom:7px;
        }
        .name{
            font:700 clamp(25px,3vw,35px) var(--display);
            line-height:1;
            letter-spacing:.2px;
        }
        .name .nick{color:#aeb9c6}
        .subtitle{
            color:#738398;
            font:600 9px var(--mono);
            letter-spacing:1px;
            margin-top:7px;
        }
        .actions{
            display:flex;flex-wrap:wrap;gap:9px;
            margin-top:21px;
        }
        .btn{
            display:inline-flex;align-items:center;justify-content:center;gap:8px;
            min-height:38px;
            padding:0 14px;
            border-radius:5px;
            border:1px solid #354457;
            background:#111a27;
            color:#eaf0f5;
            text-decoration:none;
            font-size:11px;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:.3px;
            transition:.18s ease;
        }
        .btn:hover{
            transform:translateY(-1px);
            background:#182331;
            border-color:#596777;
            box-shadow:0 8px 22px rgba(0,0,0,.2);
        }
        .btn.trade{
            background:#fff;color:#0a1018;border-color:#fff;
        }
        .btn.trade:hover{background:#dfe4e9}
        .icon{width:16px;height:16px;fill:currentColor;flex:0 0 16px}
        .stats{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            margin-top:14px;
            border:1px solid var(--line);
            border-radius:6px;
            overflow:hidden;
            background:rgba(13,20,32,.85);
        }
        .stat{
            min-width:0;padding:14px 17px;
            border-right:1px solid var(--line);
        }
        .stat:last-child{border-right:0}
        .stat b{display:block;font:700 17px var(--mono);white-space:nowrap}
        .stat span{
            display:block;margin-top:4px;
            color:var(--dim);font:600 9px var(--mono);
            text-transform:uppercase;letter-spacing:1px;
        }
        .chips{
            display:flex;gap:9px;flex-wrap:wrap;
            margin-top:12px;
        }
        .chip{
            flex:0 1 auto;
            min-width:125px;
            padding:9px 12px;
            border:1px solid var(--line);
            border-radius:5px;
            background:#0c131e;
        }
        .chip small{
            display:block;color:var(--dim);
            font:600 8px var(--mono);text-transform:uppercase;letter-spacing:.8px;
        }
        .chip strong{
            display:block;margin-top:3px;
            font:600 12px var(--mono);color:#e7edf3;
        }
        .section{
            margin-top:27px;
        }
        .section-head{
            display:flex;align-items:center;justify-content:space-between;
            gap:12px;margin-bottom:12px;
        }
        .section-title{
            display:flex;align-items:center;gap:9px;
            font:700 20px var(--display);
        }
        .section-title:before{
            content:"";width:4px;height:19px;border-radius:2px;background:#fff;
        }
        .copy-all{
            border:1px solid #3b4858;
            border-radius:5px;
            background:#111a27;color:#e7edf3;
            padding:8px 13px;cursor:pointer;
            font-size:10px;font-weight:700;text-transform:uppercase;
        }
        .copy-all:hover{background:#1a2533}
        .copy-all.done{background:#fff;color:#0a1018;border-color:#fff}
        .cmd-grid{
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:12px;
        }
        .cmd-card{
            min-width:0;
            overflow:hidden;
            border:1px solid var(--line);
            border-radius:6px;
            background:#0d1420;
            box-shadow:0 10px 25px rgba(0,0,0,.12);
        }
        .cmd-head{
            display:flex;align-items:center;gap:8px;
            padding:11px 13px;
            background:#111a27;
            border-bottom:1px solid var(--line2);
        }
        .swatch{width:7px;height:7px;border-radius:2px;background:#fff}
        .cmd-title{
            color:#aab7c6;
            font-size:11px;font-weight:700;
            text-transform:uppercase;letter-spacing:.5px;
        }
        .cmd-row{
            min-width:0;
            display:flex;align-items:center;justify-content:space-between;gap:10px;
            padding:8px 10px 8px 13px;
            border-top:1px solid var(--line2);
        }
        .cmd-row:first-of-type{border-top:0}
        .cmd-row:hover{background:#101925}
        .cmd{
            min-width:0;overflow:hidden;
            display:flex;align-items:baseline;gap:7px;
            font:500 11px var(--mono);
        }
        .cmd-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e7edf3}
        .cmd-val{flex:0 0 auto;color:#aeb9c6;font-weight:600}
        .cmd-copy{
            flex:0 0 auto;
            border:1px solid #304052;
            background:transparent;color:#718195;
            border-radius:4px;padding:4px 8px;
            cursor:pointer;font-size:9px;font-weight:700;
        }
        .cmd-copy:hover{color:#fff;border-color:#667586;background:#151f2c}
        .cmd-copy.done{color:#0b1118;background:#fff;border-color:#fff}
        .footnote{
            text-align:center;color:#566679;
            margin:22px 0 0;font:500 9px var(--mono);
        }
        .toast{
            position:fixed;left:50%;bottom:24px;
            transform:translate(-50%,15px);
            opacity:0;pointer-events:none;
            padding:10px 15px;border:1px solid #354457;border-radius:6px;
            background:#111a27;color:#fff;font-size:11px;
            transition:.2s;z-index:50;
        }
        .toast.show{opacity:1;transform:translate(-50%,0)}

        @media(max-width:760px){
            .topbar{height:auto;min-height:54px}
            .topbar-inner{padding:9px 14px;gap:14px}
            .nav{overflow:auto;scrollbar-width:none;flex:1}
            .nav::-webkit-scrollbar{display:none}
            .nav a{padding:7px 8px;font-size:9px;white-space:nowrap}
            .profile-tag{display:none}
            .page{padding:14px 12px 0}
            .profile-card{grid-template-columns:125px 1fr;min-height:150px}
            .avatar{min-height:150px}
            .profile-info{padding:18px 16px}
            .name{font-size:24px}
            .actions{margin-top:15px;gap:7px}
            .btn{min-height:34px;padding:0 10px;font-size:9px}
            .icon{width:14px;height:14px;flex-basis:14px}
            .stats{grid-template-columns:repeat(2,1fr)}
            .stat:nth-child(2){border-right:0}
            .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
            .stat{padding:12px}
            .cmd-grid{grid-template-columns:1fr}
        }
        @media(max-width:480px){
            body{padding-bottom:30px}
            .brand{font-size:19px}
            .topbar-inner{gap:8px}
            .nav{gap:1px}
            .nav a{padding:7px 6px}
            .page{padding:10px 9px 0}
            .profile-card{grid-template-columns:92px 1fr;min-height:132px}
            .avatar{min-height:132px}
            .profile-info{padding:14px 12px}
            .kicker{font-size:8px;margin-bottom:5px}
            .name{font-size:20px;line-height:1.02}
            .subtitle{font-size:7px;letter-spacing:.7px}
            .actions{margin-top:11px;gap:5px}
            .btn{min-height:31px;padding:0 8px;font-size:8px;gap:5px}
            .icon{width:13px;height:13px;flex-basis:13px}
            .stats{margin-top:10px}
            .stat{padding:10px}
            .stat b{font-size:14px}
            .stat span{font-size:7px}
            .chips{margin-top:8px}
            .chip{min-width:0;flex:1;padding:8px 9px}
            .chip small{font-size:7px}
            .chip strong{font-size:10px}
            .section{margin-top:21px}
            .section-title{font-size:18px}
            .copy-all{padding:7px 9px;font-size:8px}
            .cmd-head{padding:10px}
            .cmd-row{padding:8px}
            .cmd{font-size:10px}
            .cmd-copy{padding:4px 7px;font-size:8px}
        }
    </style>
</head>

<body>
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="#">SANJ1K <small>CS2</small></a>
        <nav class="nav">
            <a href="#profile">Profile</a>
            <a href="#config">Config</a>
            <a href="#commands">Commands</a>
            <a href="https://www.faceit.com/en/players/sanj1k1337" target="_blank" rel="noopener">FACEIT</a>
            <a href="https://steamcommunity.com/id/sanj1k/" target="_blank" rel="noopener">Steam</a>
        </nav>
        <div class="nav-spacer"></div>
        <div class="profile-tag"><i class="profile-dot"></i>sanj1k</div>
    </div>
</header>

<main class="page">
    <section class="profile-card" id="profile">
        <div class="avatar">
            <img src="avatar.jpg" alt="sanj1k profile photo">
        </div>
        <div class="profile-info">
            <div class="kicker">Player profile</div>
            <h1 class="name">Sanjar <span class="nick">"sanj1k"</span> Ismailov</h1>
            <div class="subtitle">CS2 PLAYER · UZBEKISTAN</div>
            <div class="actions">
                <a class="btn" href="https://steamcommunity.com/id/sanj1k/" target="_blank" rel="noopener">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2.2a9.8 9.8 0 0 0-9.67 8.2l5.14 2.13a2.82 2.82 0 1 1-.34 2.65l-3.65-1.51A9.8 9.8 0 1 0 12 2.2Zm5.33 5.13a2.72 2.72 0 1 1 0 5.44 2.72 2.72 0 0 1 0-5.44Zm0 1.35a1.37 1.37 0 1 0 0 2.74 1.37 1.37 0 0 0 0-2.74Z"/></svg>
                    Steam
                </a>
                <a class="btn" href="https://www.faceit.com/en/players/sanj1k1337" target="_blank" rel="noopener">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16l-4.6 5.2L20 15.8H4l4.55-5.8L4 4Zm5.85 6 2.18 2.6L14.2 10l-2.17-2.5L9.85 10Z"/></svg>
                    FACEIT
                </a>
                <a class="btn trade" href="https://steamcommunity.com/tradeoffer/new/?partner=778967474&token=77mPlRxl" target="_blank" rel="noopener">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M7 4h10a2 2 0 0 1 2 2v3h-2V6H7v4l-2-2-1.4 1.4L7 13.8 10.4 9.4 9 8l-2 2V4Zm10 7.8-3.4 4.4L15 18l2-2v4H7a2 2 0 0 1-2-2v-3h2v3h10v-4l2 2 1.4-1.4-3.4-4.4Z"/></svg>
                    Trade
                </a>
            </div>
        </div>
    </section>

    <section class="stats" id="config">
        <div class="stat"><b>2.30</b><span>Sensitivity</span></div>
        <div class="stat"><b>68</b><span>Viewmodel FOV</span></div>
        <div class="stat"><b>150</b><span>Max Ping</span></div>
        <div class="stat"><b>STYLE 4</b><span>Crosshair</span></div>
    </section>

    <div class="chips">
        <div class="chip"><small>Game</small><strong>Counter-Strike 2</strong></div>
        <div class="chip"><small>Sensitivity</small><strong>2.3</strong></div>
        <div class="chip"><small>Crosshair</small><strong>Style 4</strong></div>
    </div>

    <section class="section" id="commands">
        <div class="section-head">
            <div class="section-title">Console commands</div>
            <button class="copy-all" id="copyAll">Copy all</button>
        </div>
        <div class="cmd-grid" id="cmdGrid"></div>
        <div class="footnote" id="lineCount"></div>
    </section>
</main>

<div class="toast" id="toast">Copied to clipboard</div>

<script>
    const groups=[
        {label:'Sensitivity & mouse',items:[['sensitivity','2.3'],['m_pitch','0.022'],['m_yaw','0.022'],['zoom_sensitivity_ratio','1']]},
        {label:'Crosshair',items:[['cl_crosshairstyle','4'],['cl_crosshairsize','1'],['cl_crosshairthickness','1'],['cl_crosshairgap','-4'],['cl_crosshairdot','false'],['cl_crosshair_t','false'],['cl_crosshairalpha','255'],['cl_crosshaircolor','4'],['cl_crosshaircolor_r','255'],['cl_crosshaircolor_g','255'],['cl_crosshaircolor_b','255'],['cl_crosshair_drawoutline','false'],['cl_crosshair_recoil','false'],['cl_crosshairusealpha','true']]},
        {label:'Viewmodel',items:[['viewmodel_fov','68'],['viewmodel_offset_x','2.5'],['viewmodel_offset_y','0'],['viewmodel_offset_z','-1.5'],['viewmodel_presetpos','3']]},
        {label:'HUD & radar',items:[['hud_scaling','1'],['cl_hud_color','9'],['cl_hud_radar_scale','0.91'],['cl_radar_scale','0.4'],['cl_radar_always_centered','true'],['cl_radar_rotate','true'],['cl_showfps','1'],['cl_showloadout','true']]},
        {label:'Audio',items:[['volume','0.5'],['snd_mixahead','0.001'],['snd_mute_losefocus','true'],['snd_headphone_eq','0'],['snd_spatialize_lerp','0']]},
        {label:'Buy menu',items:[['cl_buymenu_ct_nextround_high','5000'],['cl_buymenu_ct_nextround_low','1400'],['cl_buymenu_t_nextround_high','5000'],['cl_buymenu_t_nextround_low','1400']]},
        {label:'Misc',items:[['cl_prefer_lefthanded','false'],['cl_color','1'],['mm_dedicated_search_maxping','150'],['con_enable','true'],['cl_use_opens_buy_menu','false'],['cl_teammate_colors_show','1']]}
    ];

    const grid=document.getElementById('cmdGrid');
    let total=0;
    groups.forEach(group=>{
        const card=document.createElement('article');
        card.className='cmd-card';
        const head=document.createElement('div');
        head.className='cmd-head';
        head.innerHTML=`<span class="swatch"></span><span class="cmd-title">${group.label}</span>`;
        card.appendChild(head);
        group.items.forEach(([name,val])=>{
            total++;
            const row=document.createElement('div');
            row.className='cmd-row';
            const cmd=document.createElement('div');
            cmd.className='cmd';
            cmd.innerHTML=`<span class="cmd-name">${name}</span><span class="cmd-val">"${val}"</span>`;
            const btn=document.createElement('button');
            btn.className='cmd-copy';
            btn.textContent='Copy';
            btn.onclick=()=>copyCommand(`${name} "${val}"`,btn);
            row.append(cmd,btn);
            card.appendChild(row);
        });
        grid.appendChild(card);
    });
    document.getElementById('lineCount').textContent=`${total} commands · click any row to copy`;

    const toast=document.getElementById('toast');
    let timer;
    function showToast(msg){
        toast.textContent=msg||'Copied to clipboard';
        clearTimeout(timer);toast.classList.add('show');
        timer=setTimeout(()=>toast.classList.remove('show'),1500);
    }
    function fallbackCopy(value){
        const ta=document.createElement('textarea');
        ta.value=value;ta.style.cssText='position:fixed;left:-9999px;top:-9999px';
        document.body.appendChild(ta);ta.select();
        try{document.execCommand('copy')}catch(e){}
        ta.remove();
    }
    function copyText(value,done){
        if(navigator.clipboard&&window.isSecureContext){
            navigator.clipboard.writeText(value).then(done).catch(()=>{fallbackCopy(value);done()});
        }else{fallbackCopy(value);done()}
    }
    function copyCommand(value,btn){
        const old=btn.textContent;
        copyText(value,()=>{
            btn.textContent='Copied';btn.classList.add('done');showToast();
            setTimeout(()=>{btn.textContent=old;btn.classList.remove('done')},1200);
        });
    }
    document.getElementById('copyAll').onclick=()=>{
        const all=groups.flatMap(g=>g.items).map(([n,v])=>`${n} "${v}"`).join('; ');
        const btn=document.getElementById('copyAll');
        copyText(all,()=>{
            btn.textContent='Copied!';
            btn.classList.add('done');showToast('All commands copied');
            setTimeout(()=>{btn.textContent='Copy all';btn.classList.remove('done')},1300);
        });
    };
</script>
</body>
</html>
