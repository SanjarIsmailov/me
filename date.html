<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Go On A Date With Me? ❤️</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            overflow:hidden;
            width:100vw;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#ff6b9d,#ff8fab,#ffc2d1);
        }

        .card{
            width:90%;
            max-width:500px;
            background:rgba(255,255,255,.15);
            backdrop-filter:blur(12px);
            border-radius:25px;
            padding:35px;
            text-align:center;
            box-shadow:0 15px 40px rgba(0,0,0,.2);
        }

        h1{
            color:white;
            font-size:2rem;
            margin-bottom:15px;
        }

        p{
            color:white;
            font-size:18px;
            margin-bottom:35px;
            line-height:1.6;
        }

        #yes{
            padding:15px 40px;
            border:none;
            border-radius:999px;
            font-size:20px;
            cursor:pointer;
            background:#ff2d75;
            color:white;
            transition:.3s;
        }

        #yes:hover{
            transform:scale(1.08);
        }

        #no{
            position:fixed;
            left:70%;
            top:70%;
            padding:15px 40px;
            border:none;
            border-radius:999px;
            font-size:20px;
            cursor:pointer;
            background:white;
            color:#ff2d75;
            z-index:1000;

            transition:
                    left .7s cubic-bezier(.22,1,.36,1),
                    top .7s cubic-bezier(.22,1,.36,1),
                    transform .2s;
        }

        .result{
            display:none;
            color:white;
        }

        .result h2{
            font-size:2.3rem;
            margin-bottom:20px;
        }

        .result p{
            font-size:22px;
        }

        .heart{
            position:fixed;
            bottom:-50px;
            animation:fly linear forwards;
            pointer-events:none;
        }

        @keyframes fly{

            0%{
                transform:translateY(0) scale(.5);
                opacity:0;
            }

            20%{
                opacity:1;
            }

            100%{
                transform:translateY(-120vh) scale(1.8);
                opacity:0;
            }

        }

    </style>

</head>
<body>

<div class="card">

    <h1>🌹 Will You Go On A Date With Me? 🌹</h1>

    <p>
        Every love story is beautiful...<br>
        But I hope ours becomes my favorite. ❤️
    </p>

    <button id="yes">💖 YES</button>

    <div class="result" id="result">

        <h2>YAYYYY!! ❤️🥹</h2>

        <p>
            You just made me the happiest person alive! 💕<br><br>
            I can't wait for our date. 🌹✨
        </p>

    </div>

</div>

<button id="no">🙈 NO</button>

<script>

    const no=document.getElementById("no");
    const yes=document.getElementById("yes");
    const result=document.getElementById("result");

    function moveButton(){

        const margin=15;

        const maxX=window.innerWidth-no.offsetWidth-margin;
        const maxY=window.innerHeight-no.offsetHeight-margin;

        const x=Math.random()*(maxX-margin)+margin;
        const y=Math.random()*(maxY-margin)+margin;

        no.style.left=x+"px";
        no.style.top=y+"px";

    }

    function detectPointer(e){

        const point=e.touches?e.touches[0]:e;

        const rect=no.getBoundingClientRect();

        const cx=rect.left+rect.width/2;
        const cy=rect.top+rect.height/2;

        const dx=point.clientX-cx;
        const dy=point.clientY-cy;

        const distance=Math.sqrt(dx*dx+dy*dy);

        if(distance<140){
            moveButton();
        }

    }

    document.addEventListener("mousemove",detectPointer);
    document.addEventListener("touchmove",detectPointer,{passive:true});
    document.addEventListener("touchstart",detectPointer,{passive:true});

    no.addEventListener("mouseenter",moveButton);

    no.addEventListener("touchstart",(e)=>{
        e.preventDefault();
        moveButton();
    },{passive:false});

    window.addEventListener("resize",moveButton);

    yes.onclick=function(){

        no.style.display="none";

        yes.style.display="none";

        result.style.display="block";

        for(let i=0;i<150;i++){

            let heart=document.createElement("div");

            heart.className="heart";

            heart.innerHTML=["❤️","💖","💕","💘","💗"][Math.floor(Math.random()*5)];

            heart.style.left=Math.random()*100+"vw";

            heart.style.fontSize=(18+Math.random()*32)+"px";

            heart.style.animationDuration=(3+Math.random()*4)+"s";

            document.body.appendChild(heart);

            setTimeout(()=>{
                heart.remove();
            },7000);

        }

    };

</script>

</body>
</html>
