<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sanjar Ismailov — Personal Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        [data-theme="dark"] {
          --bg: #080808; --fg: #f0ede8; --sub: #3a3a3a; --mid: #606060;
          --card: #111; --border: rgba(255,255,255,0.07); --border-s: rgba(255,255,255,0.16);
          --particle: 240,237,232;
        }
        [data-theme="light"] {
          --bg: #f5f2ed; --fg: #0a0a0a; --sub: #c8c8c8; --mid: #888;
          --card: #eae7e2; --border: rgba(0,0,0,0.07); --border-s: rgba(0,0,0,0.18);
          --particle: 10,10,10;
        }

        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        html { height:100%; }

        body {
          min-height:100vh; background:var(--bg); color:var(--fg);
          font-family:'Syne',sans-serif; overflow-x:hidden;
          transition:background .5s, color .5s;
        }

        body::after {
          content:''; position:fixed; inset:0; z-index:9990; pointer-events:none; opacity:.05;
          background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
          background-size:180px;
        }
        /* nav */
        nav {
          position:fixed; top:0; left:0; right:0; z-index:200;
          display:flex; align-items:center; justify-content:space-between;
          padding:20px clamp(22px, 6vw, 88px);
          border-bottom:1px solid var(--border);
          backdrop-filter:blur(18px);
          background:color-mix(in srgb,var(--bg) 80%,transparent);
          animation:navIn .7s cubic-bezier(.16,1,.3,1) both;
          transition:background .5s, border-color .5s;
        }
        @keyframes navIn { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:none} }

        .nav-logo { font-family:'Bebas Neue',sans-serif; font-size:1.15rem; letter-spacing:.16em; color:var(--fg); transition:color .5s; }
        .nav-right { display:flex; align-items:center; gap:14px; }

        .toggle-btn {
          width:42px; height:42px; border:1px solid var(--border-s);
          background:var(--card); border-radius:50%; color:var(--fg);
          cursor:pointer; display:flex; align-items:center; justify-content:center;
          font-size:.75rem; transition:all .25s;
        }
        .toggle-btn:hover { background:var(--fg); color:var(--bg); transform:rotate(12deg) scale(1.04); }

        .nav-cta {
          font-family:'JetBrains Mono',monospace; font-size:.68rem; letter-spacing:.1em;
          text-decoration:none; padding:7px 18px; border:1px solid var(--border-s);
          color:var(--fg); border-radius:1px; position:relative; overflow:hidden;
          transition:color .25s, border-color .3s;
        }
        .nav-cta::before { content:''; position:absolute; inset:0; background:var(--fg); transform:scaleX(0); transform-origin:left; transition:transform .3s cubic-bezier(.16,1,.3,1); }
        .nav-cta:hover::before { transform:scaleX(1); }
        .nav-cta:hover { color:var(--bg); }
        .nav-cta span { position:relative; z-index:1; }

        /* layout */
        .layout {
          display:grid; grid-template-columns:minmax(0, .95fr) minmax(0, 1.05fr);
          min-height:calc(100vh - 62px); padding-top:82px; padding-bottom:58px;
        }

        /* ── LEFT ── */
        .left {
          display:flex; flex-direction:column; justify-content:center;
          padding:50px clamp(24px, 6vw, 88px) 72px;
          position:relative; overflow:hidden;
          border-right:1px solid var(--border);
          transition:border-color .5s;
        }
        .left::before {
          content:'SI';
          position:absolute; right:-24px; bottom:-50px;
          font-family:'Bebas Neue',sans-serif;
          font-size:clamp(200px,22vw,340px);
          color:transparent;
          -webkit-text-stroke:1px rgba(128,128,128,0.075);
          pointer-events:none; user-select:none; line-height:1;
        }

        /* ── Photo – bigger & colorful ── */
        .photo-wrap {
          position:relative; width:132px; height:132px;
          margin-bottom:32px;
          animation:fadeUp .5s .25s both;
          flex-shrink:0;
        }

        /* Rainbow spinning ring */
        .spin-ring {
          position:absolute; inset:-5px; border-radius:50%;
          background: conic-gradient(
            #ff6b6b, #ffa94d, #ffe066, #69db7c,
            #4dabf7, #cc5de8, #ff6b6b
          );
          animation:spinRing 4s linear infinite;
        }
        .spin-ring::after {
          content:''; position:absolute; inset:3px; border-radius:50%;
          background:var(--bg); transition:background .5s;
        }
        @keyframes spinRing { to{transform:rotate(360deg)} }

        .photo {
          width:132px; height:132px; border-radius:50%;
          object-fit:cover; display:block;
          position:relative; z-index:1;
          filter:contrast(1.08) saturate(1.15) brightness(1.02);
        }
        .photo-init {
          width:132px; height:132px; border-radius:50%;
          background:linear-gradient(135deg,#667eea,#764ba2);
          display:none; align-items:center; justify-content:center;
          font-family:'Bebas Neue',sans-serif; font-size:2.6rem; color:#fff;
          position:relative; z-index:1;
        }

        /* ── Name ── */
        .name {
          font-family:'Bebas Neue',sans-serif;
          font-size:clamp(46px,5.6vw,82px);
          line-height:.92; letter-spacing:.01em;
          color:var(--fg); margin-bottom:14px;
          animation:fadeUp .5s .35s both;
          transition:color .5s;
        }

        /* ── Typewriter titles ── */
        .title-row {
          display:flex; align-items:center; gap:7px;
          font-family:'JetBrains Mono',monospace;
          font-size:.76rem; letter-spacing:.06em;
          color:var(--mid); margin-bottom:28px;
          animation:fadeUp .5s .45s both;
          min-height:1.4em;
          transition:color .5s;
        }
        .title-arrow { font-size:.65rem; opacity:.5; }
        #typed { color:var(--fg); transition:color .5s; }
        #tcur {
          display:inline-block; width:2px; height:.85em;
          background:var(--fg); vertical-align:middle; margin-left:2px;
          animation:blink .85s step-end infinite;
          transition:background .5s;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

        .bio {
          font-size:1rem; font-weight:400; line-height:1.85;
          color:color-mix(in srgb,var(--fg) 58%,transparent);
          max-width:390px; margin-bottom:30px;
          animation:fadeUp .5s .55s both;
        }

        .socials { display:flex; gap:16px; margin-bottom:28px; animation:fadeUp .5s .62s both; }
        .socials a { color:var(--mid); font-size:1.05rem; text-decoration:none; transition:color .2s, transform .2s; }
        .socials a:hover { color:var(--fg); transform:translateY(-3px); }

        .cta-row { display:flex; gap:10px; animation:fadeUp .5s .7s both; }
        .btn-solid {
          font-family:'JetBrains Mono',monospace; font-size:.7rem; letter-spacing:.1em;
          text-decoration:none; padding:13px 28px; background:var(--fg); color:var(--bg);
          border-radius:6px; position:relative; overflow:hidden; transition:transform .2s;
        }
        .btn-solid::after { content:''; position:absolute; inset:0; background:rgba(0,0,0,.12); transform:translateX(-100%); transition:transform .3s cubic-bezier(.16,1,.3,1); }
        .btn-solid:hover::after { transform:translateX(0); }
        .btn-solid:hover { transform:translateY(-2px); }

        @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }

        /* ── RIGHT ── */
        .right { position:relative; overflow:hidden; background:var(--bg); transition:background .5s; min-height:460px; }
        canvas#c { position:absolute; inset:0; width:100%; height:100%; display:block; }

        .canvas-label {
          position:absolute; z-index:10; bottom:30px; right:30px;
          font-family:'JetBrains Mono',monospace; font-size:.56rem; letter-spacing:.18em;
          color:var(--sub); transition:color .5s;
          writing-mode:vertical-rl; text-orientation:mixed;
        }
to{transform:translateX(-50%)} }

        @media(max-width:768px){
          .layout{grid-template-columns:1fr;min-height:auto;padding-top:76px;padding-bottom:58px;}
          nav{padding:16px 22px;}
          .left{padding:50px 24px 44px;border-right:none;border-bottom:1px solid var(--border);}
          .right{height:68vw;min-height:300px;}
          .name{font-size:clamp(46px,12vw,76px);}
        }
        @media(prefers-reduced-motion:reduce){
          *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important;}
        }
    </style>
</head>
<body>


<nav>
    <span class="nav-logo">Sanjar's Blog</span>
    <div class="nav-right">
        <button class="toggle-btn" id="themeBtn" type="button" aria-label="Switch to light mode" title="Switch theme"><i class="fas fa-sun" id="themeIco" aria-hidden="true"></i></button>
    </div>
</nav>

<div class="layout">

    <!-- LEFT -->
    <div class="left">
        <div class="photo-wrap">
            <div class="spin-ring"></div>
            <img src="me.webp" alt="Sanjar Ismailov" class="photo"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
            <div class="photo-init">SI</div>
        </div>

        <h1 class="name">SANJAR<br>ISMAILOV</h1>

        <div class="title-row">
            <span class="title-arrow">→</span>
            <span id="typed"></span><span id="tcur"></span>
        </div>

        <p class="bio">
            Nothing is impossible — only unexplored.
        </p>

        <div class="socials">
            <a href="https://t.me/Sanjar1337"   target="_blank"><i class="fab fa-telegram"></i></a>
            <a href="https://www.linkedin.com/in/sanjar-ismailov/" target="_blank"><i class="fab fa-linkedin"></i></a>
            <a href="https://instagram.com/sanjar_ismailov7/"    target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="mailto:mrsanjarismailov@gmail.com"><i class="fas fa-envelope"></i></a>
        </div>

        <div class="cta-row">
            <a href="about.html" class="btn-solid">READ MORE</a>
        </div>
    </div>

    <!-- RIGHT -->
    <div class="right">
        <canvas id="c"></canvas>
        <span class="canvas-label">PARTICLE FIELD</span>
    </div>

</div>
</div>

<script>
    /* Theme */
    const html=document.documentElement;
    const ico=document.getElementById('themeIco');
    document.getElementById('themeBtn').addEventListener('click',()=>{
      const d=html.getAttribute('data-theme')==='dark';
      html.setAttribute('data-theme',d?'light':'dark');
      ico.className=d?'fas fa-moon':'fas fa-sun';
      document.getElementById('themeBtn').setAttribute('aria-label', d?'Switch to dark mode':'Switch to light mode');
    });

    /* ── Typewriter: single title, types once and stays ── */
    const title='Software Engineer and Cyber Security Specialist from Uzbekistan';
    let ci=0;
    const tel=document.getElementById('typed');
    const tcur=document.getElementById('tcur');

    function type(){
      tel.textContent=title.slice(0,++ci);
      if(ci===title.length){
        tcur.style.display='none';
        return;
      }
      setTimeout(type,70+Math.random()*40);
    }
    setTimeout(type,700);
/* ── Canvas: Particle Web ── */
    const cvs=document.getElementById('c');
    const ctx=cvs.getContext('2d');
    let W,H,pts=[];
    const isDark=()=>html.getAttribute('data-theme')==='dark';
    const rgb=()=>isDark()?'240,237,232':'10,10,10';

    function resize(){
      const r=cvs.parentElement.getBoundingClientRect();
      W=cvs.width=r.width; H=cvs.height=r.height;
    }
    addEventListener('resize',()=>{resize();init();});

    const TOTAL=100;

    class P{
      constructor(){this.reset(true);}
      reset(rand){
        this.x=rand?Math.random()*W:Math.random()<.5?-5:W+5;
        this.y=rand?Math.random()*H:Math.random()*H;
        this.vx=(Math.random()-.5)*.45;
        this.vy=(Math.random()-.5)*.45;
        this.r=Math.random()*1.6+.3;
        this.phase=Math.random()*Math.PI*2;
        this.speed=.008+Math.random()*.012;
      }
      tick(){
        this.phase+=this.speed;
        this.x+=this.vx; this.y+=this.vy;
        if(this.x<-10||this.x>W+10||this.y<-10||this.y>H+10) this.reset(false);
      }
    }

    function init(){pts=[];for(let i=0;i<TOTAL;i++)pts.push(new P());}

    let mx=-9999, my=-9999;
    cvs.addEventListener('mousemove',e=>{const r=cvs.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;});
    cvs.addEventListener('mouseleave',()=>{mx=-9999;my=-9999;});

    const LINK=130, MOUSE_LINK=170;

    function draw(){
      requestAnimationFrame(draw);
      ctx.clearRect(0,0,W,H);
      const c=rgb();
      pts.forEach(p=>p.tick());

      for(let i=0;i<pts.length;i++){
        const a=pts[i];
        const md=Math.hypot(a.x-mx,a.y-my);
        if(md<MOUSE_LINK){
          ctx.beginPath();
          ctx.strokeStyle=`rgba(${c},${(1-md/MOUSE_LINK)*.55})`;
          ctx.lineWidth=.7;
          ctx.moveTo(a.x,a.y); ctx.lineTo(mx,my); ctx.stroke();
        }
        for(let j=i+1;j<pts.length;j++){
          const b=pts[j];
          const d=Math.hypot(a.x-b.x,a.y-b.y);
          if(d<LINK){
            ctx.beginPath();
            ctx.strokeStyle=`rgba(${c},${(1-d/LINK)*.3})`;
            ctx.lineWidth=.45;
            ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
          }
        }
      }

      pts.forEach(p=>{
        const glow=.38+.45*Math.sin(p.phase);
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r*(0.7+0.5*Math.sin(p.phase)),0,Math.PI*2);
        ctx.fillStyle=`rgba(${c},${glow})`;
        ctx.fill();
      });

      if(mx>-100){
        ctx.beginPath();
        ctx.arc(mx,my,3,0,Math.PI*2);
        ctx.fillStyle=`rgba(${c},.75)`;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(mx,my,12,0,Math.PI*2);
        ctx.strokeStyle=`rgba(${c},.1)`;
        ctx.lineWidth=1; ctx.stroke();
      }
    }

    resize(); init(); draw();
</script>
</body>
</html>
